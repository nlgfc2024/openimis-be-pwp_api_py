name: PWP skeleton CI
on:
  push:
    branches: [mw/develop]
  pull_request:
    branches: [release/26.04]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skeleton:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m flake8 pwp_api tests --max-line-length=120
      - run: python -m django test tests --settings=tests.settings
      - run: python -m django makemigrations --check --dry-run --settings=tests.empty_settings
      - run: python -m django spectacular --settings=tests.empty_settings --urlconf=pwp_api.schema_urls --validate --fail-on-warn --file=/tmp/pwp-schema.yml
      - run: python -m build
      - name: Check wheel namespace and metadata
        run: python tests/check_wheel.py
